name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # 先建好 release，两个平台再往里传文件，避免同时创建出两个草稿
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: 创建 release（已存在则跳过）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "压缩工具 $GITHUB_REF_NAME" --notes "下载对应系统的安装包：macOS 选 .dmg，Windows 选 .exe。"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Ghostscript (mac)
        if: runner.os == 'macOS'
        run: brew install ghostscript dylibbundler && bash scripts/vendor-gs-mac.sh
      - name: Ghostscript (win)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ghostscript -y --no-progress && bash scripts/vendor-gs-win.sh
      - run: npm ci
      - name: 确保 ffmpeg 二进制已下载（npm 可能拦截安装脚本）
        run: node node_modules/ffmpeg-static/install.js
      - name: Build & publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
